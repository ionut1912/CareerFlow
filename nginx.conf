events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name carerflow-api.ro;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name carerflow-api.ro;

        ssl_certificate /etc/letsencrypt/live/carerflow-api.ro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/carerflow-api.ro/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /core/ {
            proxy_pass http://careerflow-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ai/ {
            proxy_pass http://careerflow-ai:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}