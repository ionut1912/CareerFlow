[tool.poetry]
name = "careerflow-ai"
version = "0.1.0"
description = "AI service for CareerFlow"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.100.0"
tenacity = ">=8.0.0"
uvicorn = {extras = ["standard"], version = ">=0.22.0"}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
openai = ">=1.40.0"
python-dotenv = ">=1.0.0"
python-docx = ">=1.1.0"
pdfplumber = ">=0.11.0"
python-multipart = ">=0.0.9"
# NOTE: .doc support requires LibreOffice installed on the system:
# Fedora/RHEL: sudo dnf install libreoffice
# Ubuntu/Debian: sudo apt install libreoffice
# Docker: RUN apt-get install -y libreoffice

[tool.poetry.group.dev.dependencies]
mypy = ">=1.8.0"
ruff = ">=0.1.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"
pytest-mock = ">=3.12.0"  # Added to resolve the "fixture 'mocker' not found" errors

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
exclude = ["^venv/"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "SIM",
    "C4",
    "PT",
    "ASYNC",
    "RET",
    "ARG",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.Security"
]