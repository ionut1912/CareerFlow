name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Expose the automatically generated GitHub token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN # Tell the action to pass this env var to the VPS
          script: |
            cd projects/CareerFlow

            # 1. FORȚĂM sincronizarea absolută cu GitHub (șterge orice diferență locală)
            git fetch --all
            git reset --hard origin/master

            # 2. Oprim și ștergem containerele vechi
            docker compose down --rmi all --volumes --remove-orphans

            # 3. Curățăm sistemul
            docker system prune -af --volumes

            # 4. Construim FĂRĂ CACHE (Obligă Docker să citească noul cod C#)
            docker compose build --no-cache

            # 5. Pornim aplicația
            docker compose up -d