name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Expose the automatically generated GitHub token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN # Tell the action to pass this env var to the VPS
          script: |
            cd projects/CareerFlow

            git pull https://x-access-token:${GH_TOKEN}@github.com/ionut1912/CareerFlow.git master

            # Stop AND remove containers first
            docker compose down --rmi all --volumes --remove-orphans

            # Now safe to prune everything else
            docker system prune -af --volumes

            # Rebuild and start
            docker compose up -d --build