name: PR Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  core-unit-tests:
    name: Run Core Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareerFlow.Core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

  core-integration-tests:
    name: Run Core Integration Tests
    runs-on: ubuntu-latest
    needs: core-unit-tests
    defaults:
      run:
        working-directory: CareerFlow.Core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test --no-build --configuration Release --filter "Category=Integration"

  ui-unit-tests:
    name: Run UI Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareerFlow.UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: CareerFlow.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest tests/unit

  ui-integration-tests:
    name: Run UI Integration Tests
    runs-on: ubuntu-latest
    needs: ui-unit-tests
    defaults:
      run:
        working-directory: CareerFlow.UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: CareerFlow.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx jest tests/integration

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: core-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: CareerFlow.Core
          file: CareerFlow.Core/src/CareerFlow.Core.Api/Dockerfile
          push: false
          tags: careerflow:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PACKAGE_TOKEN=${{ secrets.PACKAGE_TOKEN }}