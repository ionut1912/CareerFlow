name: PR Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  core-unit-tests:
    name: Run Core Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareerFlow.Core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Restore dependencies
        run: dotnet restore
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build
        # Building the solution here ensures all project dependencies 
        # (like Castle.Core) are copied to their respective bin folders.
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        # Now safe to use --no-build as the previous step populated the bins
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

  core-integration-tests:
    name: Run Core Integration Tests
    runs-on: ubuntu-latest
    needs: core-unit-tests
    defaults:
      run:
        working-directory: CareerFlow.Core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Restore dependencies
        run: dotnet restore
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test --no-build --configuration Release --filter "Category=Integration"

  ui-tests:
    name: Run UI Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareerFlow.UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: CareerFlow.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  ai-tests:
    name: Run AI Tests & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareerFlow.AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: CareerFlow.AI/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('CareerFlow.AI/poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run Ruff Formatter
        run: poetry run ruff format --check .

      - name: Run Mypy
        run: poetry run mypy .

      - name: Run Tests
        run: poetry run pytest

  ai-docker-build:
    name: Build AI Docker
    runs-on: ubuntu-latest
    needs: ai-tests
    defaults:
      run:
        working-directory: CareerFlow.AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Docker image
        uses: docker/build-push-action@v6
        with:
          context: CareerFlow.AI
          file: CareerFlow.AI/Dockerfile
          push: false
          tags: careerflow-ai:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  core-docker-build:
    name: Build Core Docker
    runs-on: ubuntu-latest
    needs: core-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core Docker image
        uses: docker/build-push-action@v6
        with:
          context: CareerFlow.Core
          file: CareerFlow.Core/src/CareerFlow.Core.Api/Dockerfile
          push: false
          tags: careerflow-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PACKAGE_TOKEN=${{ secrets.PACKAGE_TOKEN }}