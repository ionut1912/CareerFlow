language: "en"
early_access: true

reviews:
  auto_review:
    enabled: true
    strictness: "HIGH"
    tone: "ASSERTIVE_ARCHITECT"
    ignore_title_keywords: ["WIP", "DRAFT", "SKIP"]

  path_instructions:
    - path: "**" 
      instructions: |
        You are the Lead System Architect. 
        - DO NOT approve code violating O-complexity or Clean Architecture.
        - FAIL any PR with security vulnerabilities (OWASP 2026).
        - Use "Request Changes" for any standard violation.

    - path: "CareerFlow.Core/**/*.cs"
      instructions: |
        STRICT ENFORCEMENT (.NET 10/C# 14):
        - MANDATORY: Use RouteGroups and TypedResults. Flag ControllerBase as a legacy anti-pattern.
        - REQUIRE: C# 14 'field' keyword for all applicable backing-field properties. 
        - PERFORMANCE BLOCKER: Reject any Minimal API model lacking [JsonSerializable].
        - SECURITY: Block endpoints missing Rate Limiting policies or Prometheus mirrors.
        - STRUCTURE: Enforce Vertical Slices; MapEndpoint logic must stay in the feature folder.

    - path: "CareerFlow.AI/app/**/*.py"
      instructions: |
        ASSERTIVE PYTHON 3.14 STANDARDS:
        - HARD FAIL: Any dynamic prompt formatting not using t-strings.
        - REQUIRE: interpreters module for isolation in multi-tenant processing.
        - ENFORCE: Strict PEP 649 type hinting; reject untyped functions.
        - TOOLING: Enforce uv for dependency resolution.

    - path: "CareerFlow.UI/**/*.{ts,tsx}"
      instructions: |
        REACT NATIVE ENFORCEMENT:
        - MANDATORY: Use Bridge-less JSI layer for native modules.
        - REQUIRE: React 19 useActionState and useFormStatus hooks.
        - PERFORMANCE: Reject non-memoized components in lists; mandate FlashList.
        - ACCESSIBILITY: Block PRs missing accessibilityLiveRegion for dynamic content.

chat:
  auto_reply: true