services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: CareerFlowDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-pw.sql:/docker-entrypoint-initdb.d/init-pw.sql
    networks:
      # FIXED: Changed to match the network defined at the bottom
      - careerflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - careerflow-network
    healthcheck:
      test: timeout 10 bash -c ':> /dev/tcp/127.0.0.1/5672'
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 40s


volumes:
  postgres_data:
  rabbitmq_data:

networks:
  careerflow-network:
    driver: bridge